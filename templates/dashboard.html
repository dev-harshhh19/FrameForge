<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>All videos</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1a1a2e; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .completed { background: #e1f7e7; color: #1a7d3c; }
    .failed { background: #fde2e2; color: #a3121a; }
    .queued, .scripting, .rendering_scenes, .assembling, .delivering { background: #eef0ff; color: #1D4ED8; }
    .nav { margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <h1> All generated videos</h1>
  <div class="nav"><a href="/">← Submit a new one</a></div>
  <table>
    <thead><tr><th>Product</th><th>Status</th><th>Scenes</th><th>Video</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    async function load() {
      const r = await fetch('/api/jobs');
      const jobs = await r.json();
      const rows = jobs.map(j => {
        const name = (j.product && j.product.name) || j.product_name || j.job_id;
        const status = j.status || 'unknown';
        const scenes = j.total_scenes ? `${j.scenes_done || 0}/${j.total_scenes}` : '-';
        const link = j.video_path
          ? `<a href="/outputs/${j.video_path.split('/').pop()}" download>Download</a>`
          : `<a href="/status/${j.job_id}">View progress</a>`;
        return `<tr><td>${name}</td><td><span class="badge ${status}">${status}</span></td><td>${scenes}</td><td>${link}</td></tr>`;
      }).join('');
      document.getElementById('rows').innerHTML = rows || '<tr><td colspan=4>No videos yet.</td></tr>';
    }
    load();
  </script>
<div style="margin-top:40px; font-size:12px; color:#666;"><a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms &amp; Conditions</a></div>
</body>
</html>
