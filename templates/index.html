<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FrameForge</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1a1a2e; }
    h1 { margin-bottom: 4px; }
    .sub { color: #666; margin-top: 0; }
    label { display: block; margin-top: 16px; font-weight: 600; font-size: 14px; }
    input[type=text], textarea, input[type=email], input[type=url], input[type=color], select {
      width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box;
    }
    textarea { min-height: 70px; font-family: inherit; }
    small { color: #888; }
    button { margin-top: 24px; background: #2563EB; color: white; border: none; padding: 12px 22px; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1D4ED8; }
    .row { display: flex; gap: 16px; }
    .row > div { flex: 1; }
    .error { background: #fde2e2; color: #a3121a; padding: 10px 14px; border-radius: 4px; }
    .nav { margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <h1> FrameForge</h1>
  <p class="sub">Fill this in, hit generate, get a video. No code required.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <script>
    function toggleFormat() {
      const mode = document.getElementById('format_selector').value;
      if (mode === 'json') {
        document.getElementById('form_textual').style.display = 'none';
        document.getElementById('form_json').style.display = 'block';
      } else {
        document.getElementById('form_textual').style.display = 'block';
        document.getElementById('form_json').style.display = 'none';
      }
    }
  </script>

  <label>Input Format</label>
  <select id="format_selector" onchange="toggleFormat()">
    <option value="textual">Textual Format</option>
    <option value="json">Raw JSON</option>
  </select>

  <form action="/submit" method="post" enctype="multipart/form-data">
    <div id="form_json" style="display: none; margin-top: 16px;">
      <label>Rendering Engine</label>
      <select name="mode_json">
        <option value="local">Local (Offline)</option>
        <option value="cloud">Cloud (Gemini Omni Flash)</option>
      </select>
      <label style="margin-top: 16px;">Raw JSON</label>
      <textarea name="raw_json" placeholder='{"name": "App", "description": "..."}' style="min-height: 200px; font-family: monospace;"></textarea>
    </div>

    <div id="form_textual">
      <label>Product / project name *</label>
      <input type="text" name="name" placeholder="e.g. Nimbus Notes">

      <label>Description *</label>
      <textarea name="description" placeholder="One or two sentences about what it is and why it matters."></textarea>

      <label>Key features (one per line, or comma-separated)</label>
      <textarea name="features" placeholder="Real-time sync across every device&#10;Offline-first with automatic backup&#10;End-to-end encryption"></textarea>

      <label>Target audience</label>
      <input type="text" name="target_audience" placeholder="e.g. remote-first product teams">

      <label>Call to action</label>
      <input type="text" name="call_to_action" placeholder="e.g. Start your free trial today.">

      <div class="row">
        <div>
          <label>Brand color</label>
          <input type="color" name="brand_color" value="#2563EB">
        </div>
        <div>
          <label>Tone</label>
          <select name="tone">
            <option value="energetic">Energetic</option>
            <option value="professional">Professional</option>
            <option value="calm">Calm</option>
          </select>
        </div>
        <div>
          <label>Voice</label>
          <select name="voice" id="voice_select">
            <option value="slt">slt (US female)</option>
            <option value="rms">rms (US male)</option>
            <option value="awb">awb (Scottish male)</option>
            <option value="kal">kal (US male, classic)</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Rendering Engine</label>
          <select name="mode" id="mode_select" onchange="updateVoiceOptions()">
            <option value="local">Local (Offline)</option>
            <option value="cloud">Cloud (Gemini Omni Flash)</option>
          </select>
        </div>
      </div>

      <script>
        function updateVoiceOptions() {
          const mode = document.getElementById('mode_select').value;
          const voice = document.getElementById('voice_select');
          const localVoices = [
            {v: 'slt', t: 'slt (US female)'},
            {v: 'rms', t: 'rms (US male)'},
            {v: 'awb', t: 'awb (Scottish male)'},
            {v: 'kal', t: 'kal (US male, classic)'},
          ];
          const cloudVoices = [
            {v: 'Kore', t: 'Kore (Female, warm)'},
            {v: 'Puck', t: 'Puck (Male, energetic)'},
            {v: 'Charon', t: 'Charon (Male, deep)'},
            {v: 'Fenrir', t: 'Fenrir (Male, authoritative)'},
            {v: 'Aoede', t: 'Aoede (Female, bright)'},
            {v: 'Leda', t: 'Leda (Female, gentle)'},
            {v: 'Orus', t: 'Orus (Male, neutral)'},
            {v: 'Zephyr', t: 'Zephyr (Gender-neutral)'},
          ];
          const opts = mode === 'cloud' ? cloudVoices : localVoices;
          voice.innerHTML = '';
          opts.forEach(function(o) {
            const el = document.createElement('option');
            el.value = o.v;
            el.textContent = o.t;
            voice.appendChild(el);
          });
        }
      </script>

      <label>Logo (optional)</label>
      <input type="file" name="logo" accept="image/*">

      <label>Product image(s) (optional)</label>
      <input type="file" name="images" accept="image/*" multiple>

      <label>Notify - webhook URL (optional)</label>
      <input type="url" name="notify_webhook" placeholder="https://hooks.example.com/...">

      <label>Notify - email (optional, logged, not actually sent in this demo)</label>
      <input type="email" name="notify_email" placeholder="you@company.com">
    </div>

    <button type="submit">Generate video</button>
  </form>
  <div class="nav"><a href="/dashboard">View all generated videos →</a></div>
<div style="margin-top:40px; font-size:12px; color:#666;"><a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms &amp; Conditions</a></div>
</body>
</html>
